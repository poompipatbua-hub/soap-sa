<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการคำสั่งซื้อ — บ้านสบู่</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><a class="brand" href="index.html">บ้านสบู่<span>ORDER MANAGEMENT</span></a><a href="index.html">กลับหน้าร้าน</a></header><main class="section"><p class="eyebrow">FULFILLMENT CENTER</p><h1>จัดการคำสั่งซื้อ / หยิบ / แพ็ค / จัดส่ง</h1><p>โหมดสาธิตอ่านคำสั่งซื้อจากอุปกรณ์นี้ หากเชื่อม Google Sheets ให้ใช้ Apps Script API ตามคู่มือ</p><div style="display:flex;gap:10px;flex-wrap:wrap"><input id="pin" placeholder="Admin PIN" value="2468" style="max-width:180px"><button class="primary" onclick="loadOrders()">โหลดคำสั่งซื้อ</button></div><div id="orders"></div></main><script>
function loadOrders(){let data=JSON.parse(localStorage.getItem("soapOrders")||"[]");let el=document.querySelector("#orders");if(!data.length){el.innerHTML="<p>ยังไม่มีคำสั่งซื้อในโหมดตัวอย่าง</p>";return}el.innerHTML=data.map(o=>`<article class="product" style="padding:20px;margin:18px 0"><h2>คำสั่งซื้อ ${o.orderId}</h2><p>${o.customer} · ${o.phone}</p><p>${o.address}</p><p><b>รายการสินค้า</b></p>${o.items.map(x=>`<p>□ ${x.product} (${x.sku}) × ${x.qty} = ฿${x.qty*x.unitPrice}</p>`).join("")}<h3>ยอดรวม ฿${o.total}</h3><label>สถานะ <select id="status-${o.orderId}"><option>รอหยิบสินค้า</option><option>กำลังแพ็ค</option><option>พร้อมจัดส่ง</option><option>จัดส่งแล้ว</option></select></label><p><input id="track-${o.orderId}" placeholder="เลขพัสดุ / Tracking No."></p><button class="primary" onclick="save('${o.orderId}')">บันทึกสถานะ</button> <button class="primary" onclick="label('${o.orderId}')">พิมพ์ใบจ่าหน้า</button></article>`).join("")}
function save(id){let a=JSON.parse(localStorage.getItem("soapOrders")||"[]"),o=a.find(x=>x.orderId===id);o.status=document.querySelector("#status-"+id).value;o.tracking=document.querySelector("#track-"+id).value;localStorage.setItem("soapOrders",JSON.stringify(a));alert("บันทึกในเครื่องแล้ว")}
function label(id){let o=JSON.parse(localStorage.getItem("soapOrders")||"[]").find(x=>x.orderId===id);let w=window.open("","_blank");w.document.write(`<html lang="th"><meta charset="utf-8"><title>ใบจ่าหน้าพัสดุ ${id}</title><style>body{font-family:sans-serif;padding:25px}.label{border:2px solid #111;padding:25px;width:450px}h2{margin-top:0}</style><div class="label"><h2>ผู้รับพัสดุ</h2><h3>${o.customer}</h3><p>${o.phone}</p><p>${o.address}</p><hr><p>เลขคำสั่งซื้อ: ${o.orderId}</p><p>เลขพัสดุ: ${o.tracking||"________________"}</p><p>ร้านค้า: บ้านสบู่</p></div><script>window.print()<\/script></html>`);w.document.close()}
</script></body></html>
